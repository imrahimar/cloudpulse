services:
  db:
    image: postgres:16-alpine
    container_name: cloudpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cloudpulse}
      POSTGRES_USER: ${DATABASE_USER:-cloudpulse}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cloudpulse}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-api
    restart: unless-stopped
    ports:
      - '${PORT:-5000}:5000'
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-cloudpulse}
      DATABASE_USER: ${DATABASE_USER:-cloudpulse}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-cloudpulse}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
